# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS 配置 —— 内容后台的「字段表」。
# 改这个文件就等于改后台的表单；字段名必须和 content.config.ts 里的 zod schema 对齐，
# 写错了前台就读不到（收藏 schema 见 content.config.ts 的 posts / projects 两套）。

backend:
  name: github
  repo: Quiet1024/AI-Blog
  # 内容提交到哪个分支。已合并进 main，后台编辑直接提交到 main，
  # 提交后 GitHub Actions 会自动重建并发布（见 .github/workflows/deploy-pages.yml）。
  branch: main
  # 没有 base_url —— 意味着走「Sign In Using Access Token」(PAT) 登录，不需要任何服务端。
  # 这是纯静态站能白嫖后台的关键：登录用你自己的 GitHub token，也不经过第三方。
  #
  # ⚠️ token 权限有两个坑（都实测踩过）：
  #   1. token 里 Repository access 必须勾上 Quiet1024/AI-Blog，否则登录就报
  #      "The repository ... doesn't have the branch ..."
  #   2. **fine-grained token 只给 Contents: Write，写不了非默认分支** ——
  #      本文件指定的正是非默认分支，所以保存时会报
  #      "Resource not accessible by personal access token"。
  #      两个修法：把 Contents 和 Workflows 都设 Read and write（改完要退出重登），
  #      或直接换经典令牌 https://github.com/settings/tokens/new 勾 `repo` 一个 scope。
  #      经典令牌对所有分支都能写，省事。

# 站点地址。留空时 Sveltia 用当前页面的 origin。
# 子路径部署（GitHub Pages 的 /AI-Blog/）下，取消注释能让后台里的图片预览也正常显示。
# 本分支已接入 deploy-pages.yml，会部署到 https://quiet1024.github.io/AI-Blog/admin/
site_url: https://quiet1024.github.io/AI-Blog

# 上传的图片存到仓库的 public/uploads/，前台引用路径写成 /uploads/xxx.png。
# 与现有文章里 /chatmap/xxx.png 的写法保持同一种约定（根绝对路径，由 Nuxt 补子路径）。
media_folder: /public/uploads
public_folder: /uploads

collections:
  # ── 博客文章（Markdown，正文可渲染）───────────────────────────
  - name: posts
    label: 博客文章
    label_singular: 文章
    icon: article
    folder: /content/posts
    create: true
    extension: md
    # 不写 format —— Sveltia 对 .md 自动按 frontmatter 处理（源码 TF() 的默认分支）
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 摘要
        name: description
        widget: text
        required: false
        default: ''
        hint: 列表页和社交分享里显示的简介
      # 不指定 format —— datetime 默认就输出 ISO 的 YYYY-MM-DD，
      # 与现有文章的 date: 2026-09-18 完全一致，也符合官方「尽量用 ISO」的建议。
      - { label: 发布日期, name: date, widget: datetime, type: date }
      - { label: 更新日期, name: updated, widget: datetime, type: date, required: false }
      - { label: 标签, name: tags, widget: list, required: false, default: [] }
      - label: 封面首词
        name: kicker
        widget: string
        required: false
        hint: 封面上那个大号短词，2–4 字；留空则自动用第一个标签
      - label: 封面图
        name: cover
        widget: image
        required: false
        hint: 留空则按标签自动生成封面
      - { label: 首页头条, name: featured, widget: boolean, default: false }
      - { label: 草稿, name: draft, widget: boolean, default: false, hint: 勾上则不发布 }
      - { label: 正文用衬线体, name: serif, widget: boolean, default: true }
      - { label: 作者, name: author, widget: string, required: false }
      # ── 正文 ────────────────────────────────────────────────────────
      # modes: [raw] —— 强制纯文本（Markdown 源码）编辑模式。这一条是必须的。
      #
      # 为什么：Sveltia 的 markdown / richtext widget 底层是 Lexical，默认模式是
      # 富文本。它会把正文**解析成节点树再重新序列化回 Markdown**，这个往返会
      # 吃掉它不认识的写法 —— 长文里出现「只有部分标题被识别」「表格/分隔线变形」
      # 就是这么来的。改成纯文本模式后，编辑器不再解析，内容所见即所存。
      #
      # ⚠️ 取值命名是「两层」，不是不一致（已核对 bundle 源码）：
      # 配置层写对外名 ['rich_text','raw']，运行时用内部名 ['rich-text','plain-text']，
      # 中间有映射表 kTe={rich_text:'rich-text', raw:'plain-text'}，配置数组先过它再判定
      # `modes[0] === 'rich-text'`。所以 [raw] → ['plain-text'] → 纯文本，无切换器；
      # [raw, rich_text] → ['plain-text','rich-text'] → 默认纯文本 + 多一个模式切换器；
      # [rich_text, raw] → ['rich-text', ...] → 富文本（官方默认行为）。
      #
      # 想让编辑器保留富文本切换按钮（默认仍进纯文本）就用 [raw, rich_text]。
      # 但注意：一旦切到富文本，全文会被重新解析并序列化，复杂格式可能被改写。
      #
      # ⚠️ raw 模式的固有代价：**没有「插入图片」按钮**。
      # 官方文档在 RichText 一节的 Future Plans 里写明「These buttons are disabled
      # when raw mode is active」，而「拖拽 / 粘贴图片自动上传」也是 Lexical（富文本）
      # 的能力，纯文本编辑器不具备。这不是配置写错了，是安全换来的取舍。
      # 正文插图改为「资产库上传 + 手写 Markdown」，见下面 hint 与 SVELTIA-CMS.md。
      # 想恢复一键插图：把 modes 改成 [raw, rich_text]，会多出模式切换器，
      # 但切到富文本再保存 = 让 Lexical 重新解析并序列化全文，长文有被改写的风险。
      #
      # ⚠️⚠️ 资产库给的两个地址**都不能直接粘进正文**（2026-09-30 线上实测）：
      #   · 「公开 URL」 https://quiet1024.github.io/uploads/xxx.png        → 404
      #     它缺部署子路径 /AI-Blog。根因在 Sveltia 源码：它只取 site_url 的 origin
      #     （n._baseURL = new URL(n._siteURL).origin），配 site_url 也救不回来。
      #   · 「文件路径」 /public/uploads/xxx.png                            → 404
      #     正文要的是站点路径 /uploads/xxx.png，不是仓库路径。
      #   · 只有 /uploads/xxx.png 正确（线上 /AI-Blog/uploads/xxx.png 实测 200）。
      # 参考资料：正文图片经 ProseImg → NuxtImg → IPX，最终输出 /<base>/_ipx/_/<路径>。
      - label: 正文
        name: body
        widget: markdown
        modes: [raw]
        # 单行写法是刻意的：折叠标量（>-）会把换行折成空格，中文里会多出空格。
        # 也刻意**不写 Markdown 标记**：hint 是纯文本渲染（模板为 <p class="hint"> ），
        # `**加粗**` 会原样显示星号，`![x](y)` 也不会变成图片。
        hint: 插图：资产库上传后复制「文件路径」，粘进正文时删掉开头的 /public，写成 ![说明](/uploads/文件名.png)。资产库的「公开 URL」别用——它缺部署子路径，实测 404。

  # ── 作品集（纯 YAML 数据，没有正文）────────────────────────────
  - name: projects
    label: 作品集
    label_singular: 作品
    icon: workspace_premium
    folder: /content/projects
    create: true
    extension: yml
    # 整个文件就是数据、没有 frontmatter，所以显式声明 yaml 格式
    format: yaml
    fields:
      - { label: 项目名称, name: name, widget: string }
      - { label: 简介, name: summary, widget: text }
      - { label: 我的角色, name: role, widget: string, required: false, default: '' }
      - label: 年份
        name: year
        widget: string
        required: false
        default: ''
        hint: 文字即可，如 2026
      - { label: 技术栈, name: stack, widget: list, required: false, default: [] }
      - { label: 链接, name: link, widget: string, required: false }
      - { label: 封面图, name: cover, widget: image, required: false }
      - label: 配色
        name: accent
        widget: select
        options: [teal, amber, moss, ocean, clay, ink]
        default: teal
        hint: 取 app/data/covers.ts 里注册的 6 套配色
      - label: 排序
        name: order
        widget: number
        default: 99
        hint: 数字越小越靠前
