name: Deploy to GitHub Pages

# 推送到 main 即自动构建并发布；也可在 Actions 页面手动触发
#
# ⚠️ feat/sveltia-cms 是「Sveltia CMS 后台」的试验分支，也加进了触发列表 ——
# 目的是能用真实线上环境验证后台（手机访问、子路径部署下的行为）。
#
# 但 GitHub Pages 是「一个仓库只有一个站点」，没有按分支分开的第二个地址。
# 所以这个分支一旦被推送或手动触发，**它会构建并覆盖掉线上站点**，
# 在你再次跑一次 main 之前，线上博客显示的是这个分支的版本。
# 下面的 concurrency 分组就是为这件事准备的刹车（见注释）。
on:
  push:
    branches: [main, feat/sveltia-cms]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ 这里的 group 是**故意的**：不分分支。
#
# 代价：两个分支的发布任务全局串行，一次只能跑一个。
# 收益：这正是我们要的「刹车」——
#   1. 试验分支的构建跑起来时，会自动取消排队中的 main 构建；
#   2. 反过来，你推一次 main 也能立刻抢占、把线上覆盖回正式版本。
# 如果按分支各自分组（group: pages-${{ github.ref }}），两个分支的部署会并发写
# 同一个 Pages 站点，最终线上是哪个分支的产物完全随机 —— 那种不确定性更难排查。
#
# 回退办法：在 Actions 页面手动 Run workflow 选 main，即可把线上刷回正式版本。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 固定 Node 版本：@nuxt/content 依赖 better-sqlite3 的原生绑定，
      # 绑定是按 Node 的 ABI 版本下载/编译的，版本飘了就会 "Could not locate the bindings file"。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 项目页部署在 https://<user>.github.io/<repo>/ 子路径下，必须给 Nuxt 设置 baseURL；
      # 仓库名形如 <user>.github.io 的「用户主页」则部署在根路径，baseURL 为 '/'。
      #
      # NUXT_PUBLIC_SITE_URL 只能放「源」地址（协议+域名，不带路径）：
      # nuxt-site-config 自己就认这个变量，带了路径会在构建期报警告；
      # 而 sitemap 会自己把 baseURL 拼到 <loc> 上，所以子路径交给 baseURL 即可。
      - name: 计算 baseURL 与站点源地址
        id: site
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
          fi
          echo "url=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 先确认 better-sqlite3 的原生绑定装好了再往下走。
      # 没有这一步的话，报错会一路绕到 Nuxt 构建里，只看到
      # "Could not locate the bindings file" 这种不好定位的信息。
      - name: 校验原生模块
        run: node -e "require('better-sqlite3'); console.log('better-sqlite3 原生绑定 OK')"

      - name: 生成纯静态站点
        env:
          NUXT_APP_BASE_URL: ${{ steps.site.outputs.base }}
          NUXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
        run: bun run static

      # GitHub Pages 默认会用 Jekyll 处理站点，而 Jekyll 会忽略 _nuxt/ 与
      # __nuxt_content/ 这类下划线开头的目录 —— 不关掉的话 CSS/JS 全部 404，页面变成裸 HTML。
      # 仓库里已经放了 public/.nojekyll，这里再补一次，双保险。
      - name: 关闭 Jekyll
        run: touch .output/public/.nojekyll

      # enablement: true —— 仓库还没开 Pages 时自动开启（build_type=workflow），
      # 省掉「Settings → Pages → Source 选 GitHub Actions」这一步手工操作。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
